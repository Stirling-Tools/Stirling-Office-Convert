name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        java: ['25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux test fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-wqy-zenhei fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Build, test, javadoc
        run: ./gradlew build javadoc --no-daemon --stacktrace
      - name: Publish to a local repository (checks the POM and jars assemble)
        run: ./gradlew publishToMavenLocal --no-daemon

  licence-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the licence override filter
        run: ./gradlew -p buildSrc test --no-daemon
      - name: Check dependency licences
        run: ./gradlew checkLicense --no-parallel --no-daemon
      - name: Upload the dependencies without an allowed licence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-without-allowed-license.json
          path: build/reports/dependency-license/dependencies-without-allowed-license.json
          retention-days: 3
