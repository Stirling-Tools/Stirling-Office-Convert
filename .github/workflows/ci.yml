name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_FONTS: fonts-noto-core fonts-noto-cjk fonts-wqy-zenhei fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea

jobs:
  linux:
    name: linux (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tasks: ':core:test'
          - shard: topdf
            tasks: ':topdf:test'
          - shard: other
            tasks: 'check -x :core:test -x :topdf:test'
          - shard: assemble
            tasks: 'assemble javadoc publishToMavenLocal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore test font packages
        if: matrix.shard != 'assemble'
        id: fonts
        uses: actions/cache@v4
        with:
          path: ~/test-fonts
          key: test-fonts-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Download test font packages
        if: matrix.shard != 'assemble' && steps.fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/test-fonts/partial
          sudo apt-get update
          sudo apt-get install -y --download-only -o Dir::Cache::archives="$HOME/test-fonts" $TEST_FONTS
          sudo chown -R "$USER" ~/test-fonts
      - name: Install test fonts
        if: matrix.shard != 'assemble'
        run: sudo dpkg -i ~/test-fonts/*.deb
      - name: Gradle
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, javadoc
        run: ./gradlew build javadoc --no-daemon --stacktrace

  licence-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the licence override filter
        run: ./gradlew -p buildSrc test --no-daemon
      - name: Check dependency licences
        run: ./gradlew checkLicense --no-parallel --no-daemon
      - name: Upload the dependencies without an allowed licence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-without-allowed-license.json
          path: build/reports/dependency-license/dependencies-without-allowed-license.json
          retention-days: 3
