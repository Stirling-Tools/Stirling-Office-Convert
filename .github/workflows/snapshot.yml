name: Snapshot to Central Portal

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install Linux test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-wqy-zenhei fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

  publish:
    name: Publish snapshot
    needs: build
    runs-on: ubuntu-latest
    environment: maven
    env:
      HAS_CENTRAL_CREDENTIALS: ${{ secrets.CENTRAL_PORTAL_USERNAME != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true
      - name: Publish snapshot
        if: env.HAS_CENTRAL_CREDENTIALS == 'true'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew :core:publishAllPublicationsToCentralPortalRepository :legacy:publishAllPublicationsToCentralPortalRepository :topdf:publishAllPublicationsToCentralPortalRepository :pdfa:publishAllPublicationsToCentralPortalRepository :lineart:publishAllPublicationsToCentralPortalRepository :optimize:publishAllPublicationsToCentralPortalRepository --no-daemon --stacktrace
