name: Release to Central Portal

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). If omitted on tag push, derived from the tag.'
        required: false
      autoRelease:
        description: 'Auto-release to Maven Central without the manual Publish click'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: '$VERSION' is not a version like 1.2.3"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-wqy-zenhei fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Build and test
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./gradlew build "-Pofficeconvert.version=$VERSION" --no-daemon --stacktrace

      - name: Publish to Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
          AUTO_RELEASE: ${{ inputs.autoRelease }}
        run: |
          ARGS=(publishAllToCentralPortal "-Pofficeconvert.version=$VERSION")
          if [ "$AUTO_RELEASE" = "true" ]; then
            ARGS+=(-PautoRelease=true)
          fi
          ./gradlew "${ARGS[@]}" --no-daemon --stacktrace

      - name: Keep the command-line jar
        uses: actions/upload-artifact@v4
        with:
          name: stirling-office-convert-cli-${{ steps.v.outputs.version }}
          path: cli/build/libs/stirling-office-convert-cli.jar

      - name: Summary
        env:
          VERSION: ${{ steps.v.outputs.version }}
          AUTO_RELEASE: ${{ inputs.autoRelease }}
        run: |
          echo "### Published com.stirling:stirling-office-convert:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTO_RELEASE" = "true" ]; then
            echo "Auto-release enabled: artifacts reach Maven Central in 10-30 min." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Review and click **Publish** at https://central.sonatype.com/publishing/deployments" >> "$GITHUB_STEP_SUMMARY"
          fi
